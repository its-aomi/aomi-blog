# Site
name: "Amitabh Borah"
title: "Amitabh Borah"
description: "Hi i am Amitabh Borah, a freelance developer !!"
logo: 'assets/images/logo-aomi.png'
favicon: 'favicon.ico'
baseurl: /
google_analytics: ''
disqus: ''
mailchimp-list: ''
include: ["_pages"]
permalink: /:title/
email: contact@aomi.blog

# Authors
authors:
  Amitabh Borah:
    name: Amitabh Borah
    display_name: Amitabh Borah
    avatar: 'assets/images/me.jpg'
    email: contact@aomi.blog
    web: https://aomi.blog/
    twitter: 
    description: "Freelance developer. Providing affordable plugins at 1dollarCode.com."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-figure
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
highlighter: none
markdown: kramdown
kramdown:
   syntax_highlighter_opts:
      disable : true



# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: ""
adsense-data-ad-slot: ""

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

# Post Author Box ("enabled" or "disabled")
authorbox: "enabled"

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Comments
comments: false

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
